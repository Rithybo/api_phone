server:
  port: 8181

spring:
  # ប្តូរមកដាក់ក្រោម spring.web វិញ
  web:
    resources:
      add-mappings: true
    error:
      include-message: always
      include-binding-errors: always
      include-stacktrace: never

  datasource:
    url: jdbc:postgresql://localhost:5432/phone_project
    username: phone
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true